services:
  ollama:
    image: ollama/ollama:latest
    container_name: joke-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    restart: unless-stopped

  app:
    build:
      context: .
      target: prod
    container_name: joke-app
    ports:
      - "3000:3000"
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen:1.8b}
      - TAILSCALE_IP=${TAILSCALE_IP:-0.0.0.0}
      - EXPORT_PATH=${EXPORT_PATH:-}
      - OUTDIR=${OUTDIR:-}
    volumes:
      - /app/node_modules
    depends_on:
      ollama:
        condition: service_started
    restart: unless-stopped

  train:
    build:
      context: .
      dockerfile: Dockerfile.train
    container_name: joke-train
    volumes:
      - ./scripts:/app/scripts
      - ./dataset.jsonl:/app/dataset.jsonl
      - ./qwen-jokes-lora:/app/qwen-jokes-lora
      - ollama-data:/root/.ollama
    environment:
      - OLLAMA_HOST=http://ollama:11434
    depends_on:
      - ollama
    profiles:
      - train
    entrypoint: ["/bin/bash"]

volumes:
  ollama-data:
